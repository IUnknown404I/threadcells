name: Bug report
description: Report a reproducible ThreadCells defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove secrets, private data, private paths, and unrelated logs. Report security-sensitive findings through [private vulnerability reporting](https://github.com/IUnknown404I/threadcells/security/advisories/new), not this form.
  - type: input
    id: summary
    attributes:
      label: Problem summary
      description: What is broken?
      placeholder: A concise description of the problem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ThreadCells version or revision
      description: Include this when known and relevant.
      placeholder: v0.2.0-alpha.1 or a commit SHA
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and how seriously?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or durable evidence
      description: Provide safe reproduction steps, or durable technical evidence when deterministic reproduction is impractical.
      placeholder: Steps, frequency, and the smallest relevant evidence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened, including safe error text if useful?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include OS, provider, browser, or deployment details only when they affect the problem.
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Optional. Remove credentials, personal data, private messages, private paths, state databases, and terminal transcripts.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result would show that the problem is resolved?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched open and closed Issues for this problem.
          required: true
        - label: This report contains no secrets, private data, or security-sensitive disclosure.
          required: true
