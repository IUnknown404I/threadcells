name: Documentation problem
description: Report missing, stale, or unclear ThreadCells documentation
title: "[Docs] "
labels:
  - documentation
body:
  - type: input
    id: area
    attributes:
      label: Affected page or area
      description: Link the page or name the documentation area.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing, stale, or unclear?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected documentation truth
      description: What should a reader be able to understand or do?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional. A concise proposed wording or example is welcome.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched open and closed Issues for this documentation problem.
          required: true
        - label: This report contains no secrets or private data.
          required: true
